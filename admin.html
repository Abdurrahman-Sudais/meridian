<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>MERIDIAN — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0b0b0c;--bg2:#141416;--bg3:#1b1b1e;--fg:#f2efe9;--mute:#8d8a85;--line:#2a2a2d;--accent:#c8a96a;--ok:#7fb48a;--warn:#e0a458;--bad:#d9776b;--serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,sans-serif;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);min-height:100vh}
button,input,select{font:inherit;color:inherit}
h1,h2{font-family:var(--serif);font-weight:300}
.hidden{display:none!important}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:min(360px,100%);display:grid;gap:14px;text-align:center}
.login h1{font-size:34px;letter-spacing:.3em;margin-bottom:4px}
.login p{color:var(--mute);margin-bottom:12px}
input,select{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;width:100%;min-width:0;font-size:16px}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.btn{background:var(--accent);color:#111;border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;transition:filter .2s}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.err{color:var(--bad);min-height:20px;font-size:13px}

/* Shell */
header{position:sticky;top:0;z-index:5;background:rgba(11,11,12,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:20px}
.brand{font-family:var(--serif);letter-spacing:.3em;font-size:18px}
.brand small{font-family:var(--sans);letter-spacing:.15em;font-size:10px;color:var(--accent);margin-left:8px;text-transform:uppercase}
nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto}
nav button{background:none;border:0;padding:8px 14px;border-radius:99px;color:var(--mute);cursor:pointer;white-space:nowrap}
nav button.on{background:var(--bg3);color:var(--fg)}
main{max-width:1240px;margin:auto;padding:28px 20px 80px}
.view h2{font-size:28px;margin-bottom:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.view h2 .tools{margin-left:auto;display:flex;gap:8px;font-family:var(--sans);font-size:14px}
.view h2 select{width:auto;font-size:14px;padding:8px 12px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:34px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px}
.stat b{display:block;font-family:var(--serif);font-weight:300;font-size:30px;margin-top:6px}
.stat span{color:var(--mute);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.stat.hl b{color:var(--accent)}

/* Orders */
.order{background:var(--bg2);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.order summary{list-style:none;display:grid;grid-template-columns:1.3fr 1.6fr 1fr auto;gap:14px;align-items:center;padding:14px 18px;cursor:pointer}
.order summary::-webkit-details-marker{display:none}
.order .ref{font-family:ui-monospace,monospace;font-size:12px;color:var(--mute)}
.order .who b{display:block;font-weight:500}
.order .who span{color:var(--mute);font-size:12px}
.order .amt{font-weight:600;text-align:right}
.pill{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--bg3);color:var(--mute);white-space:nowrap}
.pill.paid{background:rgba(127,180,138,.15);color:var(--ok)}
.pill.shipped{background:rgba(200,169,106,.15);color:var(--accent)}
.pill.paid_needs_review{background:rgba(224,164,88,.15);color:var(--warn)}
.pill.failed,.pill.cancelled,.pill.refunded{background:rgba(217,119,107,.12);color:var(--bad)}
.order-body{border-top:1px solid var(--line);padding:16px 18px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px}
.order-body table{width:100%;border-collapse:collapse}
.order-body td{padding:6px 0;border-bottom:1px solid var(--line)}
.order-body td:last-child{text-align:right}
.order-body .tot td{border:0;font-weight:600;padding-top:10px}
.order-body h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:8px;font-weight:500}
.order-body p{color:var(--fg);margin-bottom:4px}
.order-body .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.order-body .acts .btn{padding:8px 14px;font-size:13px}
.note{background:rgba(224,164,88,.1);border:1px solid rgba(224,164,88,.3);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}

/* Products */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.prod{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.prod img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:var(--bg3)}
.prod b{display:block;font-weight:500;line-height:1.3}
.prod small{color:var(--mute)}
.prod .ctl{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.prod label{font-size:11px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;display:grid;gap:4px}
.prod input{padding:8px 10px;font-size:14px}
.prod.off{opacity:.55}
.prod .sold{color:var(--bad)}
.toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);cursor:pointer;padding-bottom:9px}
.toggle input{width:auto}

/* Promos */
.promo-form{display:grid;grid-template-columns:2fr 1fr auto;gap:10px;margin-bottom:18px;max-width:560px}
.promo{display:flex;align-items:center;gap:14px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px;max-width:560px}
.promo code{font-size:15px;letter-spacing:.08em;flex:1}
.empty{color:var(--mute);padding:40px 0;text-align:center}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;transition:transform .45s var(--ease);z-index:10}
.toast.on{transform:translate(-50%,0)}

@media (max-width:720px){
  .bar{flex-wrap:wrap;gap:10px}nav{margin-left:0;width:100%}
  .order summary{grid-template-columns:1fr auto;gap:6px 12px}
  .order .ref{grid-column:1/-1}
  .order-body{grid-template-columns:1fr}
  .promo-form{grid-template-columns:1fr 90px auto}
}
</style>
</head>
<body>

<section class="login" id="login">
  <form id="loginForm">
    <h1>MERIDIAN</h1>
    <p>Store admin</p>
    <input type="password" id="pw" placeholder="Admin password" autocomplete="current-password" required />
    <button class="btn" type="submit">Sign in</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<div id="app" class="hidden">
  <header><div class="bar">
    <div class="brand">MERIDIAN<small>Admin</small></div>
    <nav id="tabs">
      <button data-v="overview" class="on">Overview</button>
      <button data-v="orders">Orders</button>
      <button data-v="products">Stock</button>
      <button data-v="promos">Promo codes</button>
      <button id="logout">Sign out</button>
    </nav>
  </div></header>

  <main>
    <section class="view" id="v-overview">
      <h2>Overview</h2>
      <div class="stats" id="stats"></div>
      <h2>Ready to ship</h2>
      <div id="toShip"></div>
    </section>

    <section class="view hidden" id="v-orders">
      <h2>Orders
        <span class="tools">
          <select id="statusFilter">
            <option value="">All orders</option>
            <option value="paid">Paid — to ship</option>
            <option value="paid_needs_review">Needs review</option>
            <option value="shipped">Shipped</option>
            <option value="pending">Pending (unpaid)</option>
            <option value="refunded">Refunded</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <button class="btn ghost" id="refresh">Refresh</button>
        </span>
      </h2>
      <div id="orders"></div>
    </section>

    <section class="view hidden" id="v-products">
      <h2>Stock &amp; prices</h2>
      <div class="grid" id="products"></div>
    </section>

    <section class="view hidden" id="v-promos">
      <h2>Promo codes</h2>
      <form class="promo-form" id="promoForm">
        <input id="promoCode" placeholder="CODE" required />
        <input id="promoPct" type="number" min="1" max="90" placeholder="% off" required />
        <button class="btn" type="submit">Save</button>
      </form>
      <div id="promos"></div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>
<script src="admin.js"></script>
</body>
</html>
